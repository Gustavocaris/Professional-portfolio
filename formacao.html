<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <!-- Aplica tema e idioma antes da primeira pintura (evita piscar) -->
    <script>
        (function () {
            var root = document.documentElement, theme = null, lang = null;
            try { theme = localStorage.getItem('theme'); lang = localStorage.getItem('lang'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            if (lang !== 'pt' && lang !== 'en') {
                lang = /^pt/i.test(navigator.language) ? 'pt' : 'en';
            }
            root.dataset.theme = theme;
            root.lang = lang === 'en' ? 'en' : 'pt-BR';
        })();
    </script>
    <link rel="icon" href="image/g.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/src/styles/base.css">
    <link rel="stylesheet" href="/src/styles/pages.css">
    <title>Formação · Gustavo Caris</title>
</head>
<body>
    <div id="app"></div>

    <script type="module" src="/src/pages/education.ts"></script>
</body>
</html>
