<!DOCTYPE html>

    <meta name="color-scheme" content="dark light">
    <!-- Aplica tema e idioma antes da primeira pintura (evita piscar) -->
    <script>
        (function () {
            var root = document.documentElement, theme = null, lang = null;
            try { theme = localStorage.getItem('theme'); lang = localStorage.getItem('lang'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            if (lang !== 'pt' && lang !== 'en') {
                lang = /^pt/i.test(navigator.language) ? 'pt' : 'en';
            }
            root.dataset.theme = theme;
            root.lang = lang === 'en' ? 'en' : 'pt-BR';
        })();
    </script>
    <!-- Intro de partículas: só ao entrar no site ou dar F5, nunca ao voltar das páginas internas -->
    <script>
        (function () {
            try {
                if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
                var type = nav ? nav.type : '';
                var internal = false;
                try { internal = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
                if (type === 'reload' || (type !== 'back_forward' && !internal)) {
                    document.documentElement.setAttribute('data-intro', '');
                }
            } catch (e) {}
        })();
    </script>
